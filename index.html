<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>High Key Arts</title>
  <link rel="icon" type="image/png" href="hk3.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="High Key Arts Alaska, Tarot, Gong, Magic, Heka.">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #4b0082; 
      color: #00ff00;           
      font-family: "Papyrus", "Palatino Linotype", "Palatino", "Georgia", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .content-box {
      max-width: 90%;
    }

    .message-text {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .center-logo {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <main class="content-box">

    <h1 class="visually-hidden">High Key Arts Alaska, Tarot, Gong, Magic, Heka.</h1>
    <div class="message-text">Hello World, see you soon.</div>
    
    <!-- <img src="logo.png" alt="High Key Arts Alaska Tarot Gong Magic Heka." class="center-logo"> -->
  </main>

</body>
</html>
